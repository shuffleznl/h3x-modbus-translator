[project]
name = "h3x-modbus-translator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["pymodbus==3.13.1"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "pyyaml>=6", "ruff>=0.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
